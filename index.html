<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Prism Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.9'%3E%3Cstop offset='0' stop-color='%2340C8E0'/%3E%3Cstop offset='.45' stop-color='%23BF5AF2'/%3E%3Cstop offset='1' stop-color='%23FF375F'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="brand">
        <span class="orb" aria-hidden="true"></span>
        <span class="brand-name">Prism</span>
      </div>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <nav class="chat-list" id="chatList" aria-label="Chat history"></nav>
      <button class="settings-btn" id="openSettings" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        API settings
      </button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open conversations">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="title" id="chatTitle">New chat</h1>
        <button class="model-pill" id="modelPill" type="button" title="Change provider or model"></button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <form class="composer-wrap" id="composer" autocomplete="off">
        <div class="box" id="box">
          <textarea id="input" rows="1" placeholder="Message Prism" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message">
            <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          </button>
        </div>
        <p class="hint">Responses come directly from the provider you configure. Check important information.</p>
      </form>
    </main>
  </div>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="sheet" id="settingsForm">
      <header>
        <h2 id="settingsTitle">API settings</h2>
        <button class="icon-btn" value="cancel" aria-label="Close" formnovalidate>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="seg" id="providerSeg" role="tablist" aria-label="Provider">
        <button type="button" role="tab" data-p="openai">OpenAI</button>
        <button type="button" role="tab" data-p="anthropic">Anthropic</button>
        <button type="button" role="tab" data-p="gemini">Gemini</button>
        <button type="button" role="tab" data-p="custom">Custom</button>
      </div>

      <label class="field">
        <span>API key</span>
        <div class="key-row">
          <input id="apiKey" type="password" spellcheck="false" autocomplete="off" placeholder="Paste your key">
          <button type="button" class="ghost" id="toggleKey">Show</button>
        </div>
        <small id="keyHelp"></small>
      </label>

      <label class="field">
        <span>Model</span>
        <input id="model" list="modelList" spellcheck="false" autocomplete="off">
        <datalist id="modelList"></datalist>
      </label>

      <label class="field">
        <span>Base URL</span>
        <input id="baseUrl" spellcheck="false" autocomplete="off">
        <small id="baseHelp">Change this only for proxies or OpenAI-compatible servers such as Ollama, Groq, or OpenRouter.</small>
      </label>

      <label class="field">
        <span>System prompt</span>
        <textarea id="system" rows="3" placeholder="Optional. For example: Answer briefly and in plain language."></textarea>
      </label>

      <div class="field">
        <span>Creativity</span>
        <div class="temp-row">
          <label class="check"><input type="checkbox" id="tempAuto"> Use provider default</label>
          <input type="range" id="temp" min="0" max="1" step="0.1" aria-label="Creativity">
          <output id="tempOut"></output>
        </div>
      </div>

      <p class="note">Your key is saved only in this browser (localStorage) and sent only to the provider's API. Clear it any time with the button below.</p>

      <footer>
        <button type="button" class="ghost danger" id="clearKey">Remove key</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="cancelSettings">Cancel</button>
        <button type="submit" class="primary" id="saveSettings" value="save">Save</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
